spring:
  application:
    name: ricas-flix
  mongodb:
    database: ${MONGODB_DATABASE:sample_mflix}
    uri: ${MONGODB_URI:mongodb://localhost:27017/ricas-flix}
app:
  movie-search:
    collection: ${MOVIE_COLLECTION:embedded_movies}
    vector-index: ${MOVIE_VECTOR_INDEX:vector_index}
    text-index: ${MOVIE_TEXT_INDEX:default}
    embedding-path: ${MOVIE_EMBEDDING_PATH:plot_embedding_voyage_3_large}
    limit: ${MOVIE_SEARCH_LIMIT:5}
    num-candidates: ${MOVIE_SEARCH_NUM_CANDIDATES:300}
    vector-weight: ${MOVIE_VECTOR_WEIGHT:0.7}
    text-weight: ${MOVIE_TEXT_WEIGHT:0.3}
    voyage:
      base-url: https://api.voyageai.com/v1
      api-key: ${VOYAGE_API_KEY:}
      model: ${VOYAGE_MODEL:voyage-3-large}
      output-dimension: ${VOYAGE_OUTPUT_DIMENSION:2048}

server:
  port: ${PORT:8080}

logging:
  level:
    br.com.ricas.movie: INFO
    org.springframework.data:
      mongodb: DEBUG
